name: Validate LOTRO translation pipeline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'schemas/**'
      - 'scripts/**'
      - 'developer-tool/automation/**'
      - 'tests/fixtures/**'
      - 'tests/run-translation-contract.ps1'

permissions:
  contents: read

concurrency:
  group: translation-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-and-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate any submitted source bundles
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path . -Recurse -File -Filter '*.source-bundle.json')
          foreach ($bundle in $bundles) { ./scripts/validate-source-bundle.ps1 -Path $bundle.FullName }
          if ($bundles.Count -eq 0) { Write-Output 'No persistent source bundle in repository; client-assisted uploads remain opt-in/transient.' }
      - name: Run provider-safe contract
        shell: pwsh
        run: ./tests/run-translation-contract.ps1
      - name: Validate semantic patch schema syntax
        shell: pwsh
        run: |
          Get-Content -LiteralPath ./schemas/semantic-translation-patch.schema.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content -LiteralPath ./schemas/source-bundle.schema.json -Raw | ConvertFrom-Json | Out-Null
      - name: Enforce private release QA summaries when present
        shell: pwsh
        run: |
          $summaries = @(Get-ChildItem -Path . -Recurse -File -Filter '*release*qa*.json')
          foreach ($summary in $summaries) {
            $output = Join-Path $summary.DirectoryName ($summary.BaseName + '.verified.json')
            python ./developer-tool/automation/validate_release_qa.py --summary $summary.FullName --output $output
          }
          if ($summaries.Count -eq 0) { Write-Output 'No release QA summary in public repository; private release gate remains required.' }

  # This validation workflow validates the provider-independent contract without
  # proprietary game data. Real source refresh and release generation run only
  # on the trusted Windows source machine after the official version watcher
  # reports a change.
